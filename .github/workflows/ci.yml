name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu builds natively against glibc, where layout bugs between
        # Zig's std structs and libc's show up (see the pty test in
        # src/term/Terminal.zig)
        os: [ubuntu-latest, macos-latest]
        # ReleaseSafe is what releases and the Nix package ship. Its stack
        # protector catches overflows that Debug builds can hide.
        optimize: [Debug, ReleaseSafe]
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # the flake's dev shell, so CI has the same Zig and Neovim nightly as
      # development. nix-community's cache has Neovim nightly built.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # -Dnvim-required: the tests that drive Neovim fail, not skip, if it
      # isn't there. -Dgolden: the golden tests too.
      - name: Test
        run: nix develop -c zig build test -Doptimize=${{ matrix.optimize }} -Dgolden -Dnvim-required --summary all
